<text x="132" y="84" font-size="11" fill="#b03a3a" text-anchor="start">sealed (infiltration only) ~7,600 ppm</text>
<path d="M150,88 L118.42857142857143,106.40000000000003" fill="none" stroke="#b03a3a" stroke-width="1"/>
<line x1="96" y1="431.5" x2="648" y2="431.5" stroke="#2e7d4f" stroke-width="1.8" stroke-dasharray="7,5"/>
<text x="104" y="425.5" font-size="11" fill="#2e7d4f" text-anchor="start" font-weight="bold">&lt;1,000 ppm spec (P17)</text>
