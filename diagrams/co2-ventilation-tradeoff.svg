<text x="104" y="377.0" font-size="11" fill="#b03a3a" text-anchor="start">2,000 ppm alarm + forced boost</text>
<line x1="562.2857142857142" y1="92" x2="562.2857142857142" y2="480" stroke="#7a4fa3" stroke-width="1.6" stroke-dasharray="6,4"/>
<text x="562.2857142857142" y="82" font-size="11" fill="#7a4fa3" text-anchor="middle" font-weight="bold">ventilation floor 48 m³/h</text>
<path d="M552,387.85 L552,425.5" fill="none" stroke="#2e7d4f" stroke-width="2.2" marker-end="url(#arr)"/>
<text x="544" y="416.95" font-size="11" fill="#2e7d4f" text-anchor="end" font-weight="bold">CO₂ battery</text>
<text x="544" y="431.95" font-size="11" fill="#2e7d4f" text-anchor="end">closes the gap</text>
<rect x="672" y="200" width="258" height="96" rx="7" fill="#f6f6f2" stroke="#8a8a80" stroke-width="1.4"/>
<text x="801.0" y="219.96" font-size="12" fill="#1a232c" text-anchor="middle" font-weight="bold">The floor alone is not enough</text>
<text x="801.0" y="235.96" font-size="11" fill="#26303a" text-anchor="middle">48 m³/h → 1,920 ppm awake —</text>
<text x="801.0" y="251.96" font-size="11" fill="#26303a" text-anchor="middle">above spec even at full ration.</text>
<text x="801.0" y="267.96000000000004" font-size="11" fill="#26303a" text-anchor="middle">Recirc / cascades move moisture,</text>
<text x="801.0" y="283.96000000000004" font-size="11" fill="#26303a" text-anchor="middle">never CO₂.</text>
<rect x="672" y="312" width="258" height="96" rx="7" fill="#f5eefb" stroke="#7a4fa3" stroke-width="1.4"/>
<text x="801.0" y="331.96" font-size="12" fill="#1a232c" text-anchor="middle" font-weight="bold">Layer 2 — CO₂ battery (X10)</text>
<text x="801.0" y="347.96" font-size="11" fill="#26303a" text-anchor="middle">two-bed amine TSA · ~1.6 kg/day</text>
<text x="801.0" y="363.96" font-size="11" fill="#26303a" text-anchor="middle">regen 85–95 °C · ~1.6–2.5 kWh/day</text>
<text x="801.0" y="379.96" font-size="11" fill="#26303a" text-anchor="middle">the only path &lt;1,000 ppm sealed</text>
<text x="801.0" y="395.96" font-size="11" fill="#26303a" text-anchor="middle">required-PENDING test J</text>
<rect x="672" y="424" width="258" height="80" rx="7" fill="#fdecec" stroke="#b03a3a" stroke-width="1.4"/>
<text x="801.0" y="443.96" font-size="12" fill="#1a232c" text-anchor="middle" font-weight="bold">Why the interlock is mechanical</text>
<text x="801.0" y="459.96" font-size="11" fill="#26303a" text-anchor="middle">each 12 m³/h cut saves ~3.8 kWh/day</text>
<text x="801.0" y="475.96" font-size="11" fill="#26303a" text-anchor="middle">of heat at DP-A (ε 0.8) — a standing</text>
<text x="801.0" y="491.96" font-size="11" fill="#26303a" text-anchor="middle">temptation the min stop forecloses</text>
<text x="30" y="556" font-size="11" fill="#5a646e" text-anchor="start">Asleep values run ~35% lower (0.047 m³/h); per-room maxima govern the interlock — closed doors run +2,000–2,900 ppm over the main space.</text>
</svg>