<text x="798.5564990605293" y="476" font-size="11" fill="#5a646e" text-anchor="middle">200</text>
<line x1="884.8" y1="106" x2="884.8" y2="456" stroke="#e2e6ea" stroke-width="1"/>
<text x="884.7768342728041" y="476" font-size="11" fill="#5a646e" text-anchor="middle">500</text>
