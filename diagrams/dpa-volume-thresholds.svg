<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" font-family="DejaVu Sans, Verdana, sans-serif">
<title>DP-A volume-threshold ladder, liquid track</title>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#46525e"/></marker><marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a94a0"/></marker></defs>
<rect x="0" y="0" width="1000" height="560" fill="#ffffff"/>
<text x="30" y="32" font-size="17" fill="#26303a" text-anchor="start" font-weight="bold">Volume-threshold ladder at DP-A — liquid track service classes</text>
<text x="30" y="52" font-size="12" fill="#5a646e" text-anchor="start">doc 00 §6 · serviceable occupied/unattended volume per mode (solid track is full-AC class at ~100 m³)</text>
